name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build x86_64 binary
        run: cargo build --release

      - name: Setup ARM64 cross-compilation
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Build ARM64 binary
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package x86_64 binary
        run: tar czf ksm-linux-x86_64.tar.gz -C target/release ksm

      - name: Package ARM64 binary
        run: tar czf ksm-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release ksm

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read and transform release notes
        id: notes
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            # Transform relative links to absolute GitHub URLs
            sed 's|\.\./\([^)]*\.md\)|https://github.com/jabanayt/kiro-session-manager/blob/main/docs/\1|g' "$NOTES_FILE" | \
            sed 's|\.\./\.\./\([^)]*\.md\)|https://github.com/jabanayt/kiro-session-manager/blob/main/\1|g' > /tmp/release_notes.md
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            cat /tmp/release_notes.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          draft: true
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: |
            ksm-linux-x86_64.tar.gz
            ksm-linux-aarch64.tar.gz
