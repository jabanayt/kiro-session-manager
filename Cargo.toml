[package]
name = "ksm"
version = "0.2.4"
edition = "2024"
description = "A lightweight CLI tool to manage kiro-cli chat sessions"
authors = ["Sean"]
repository = "https://github.com/jabanayt/kiro-session-manager"
license = "Apache-2.0 OR GPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
unicode-width = "0.2"
